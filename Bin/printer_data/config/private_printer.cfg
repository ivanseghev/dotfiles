[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    SAVE_GCODE_STATE NAME=load_state
    M117 Loading filament...
    
    # Check if nozzle is hot enough
    {% if printer.extruder.temperature < TEMP %}
        M117 Heating to {TEMP}C...
        M109 S{TEMP}
    {% endif %}

    G91                   # Relative positioning
    G92 E0                # Reset extruder
    G1 E70 F400           # Fast load into gears/nozzle (Adjust for Bear/MK3S height)
    G1 E40 F100           # Slow purge
    G92 E0
    G90                   # Absolute positioning
    M400                  # Wait for moves to finish
    M117 Load Complete
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}
    SAVE_GCODE_STATE NAME=unload_state
    M117 Unloading filament...

    # Check if nozzle is hot enough
    {% if printer.extruder.temperature < TEMP %}
        M117 Heating to {TEMP}C...
        M109 S{TEMP}
    {% endif %}

    G91                   # Relative positioning
    G92 E0                # Reset extruder
    # Tip forming / RAMming (Optional)
    G1 E10 F300           # Extrude a bit to clear tip
    G1 E-15 F3000         # Quick retract to pull out of melt zone
    # Final Unload
    G1 E-65 F1000         # Retract the rest of the way
    G92 E0
    G90                   # Absolute positioning
    M400                  # Wait for moves to finish
    M117 Remove Filament Now
    RESTORE_GCODE_STATE NAME=unload_state

