[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_0B700110E484CA950DE28F61C32000F5-if00

[pause_resume]
recover_velocity: 50.0

[display_status]

[virtual_sdcard]
path: /home/shevan/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# This file contains common pin mappings for the BIGTREETECH SKR V1.4
# board. To use this config, the firmware should be compiled for the
# LPC1768 or LPC1769(Turbo).

# See docs/Config_Reference.md for a description of parameters.
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 200

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: -5        # Allows the nozzle to reach -3.0 for probing
position_max: 250
homing_speed: 40
homing_retract_dist: 0
second_homing_speed: 15
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.550
interpolate: true
# hold_current: 0.5
stealthchop_threshold: 0
diag_pin: P1.29
driver_SGTHRS: 130  # Adjust for sensorless homing sensitivity

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -4    # Standard Prusa offset to keep 0 on the bed
position_min: -4
position_max: 210
homing_speed: 40
homing_retract_dist: 0
second_homing_speed: 15
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.650
interpolate: true
# hold_current: 0.5
stealthchop_threshold: 0
diag_pin: P1.28
driver_SGTHRS: 135 # Adjust for sensorless homing sensitivity

# ---------------- Z Axis (Dual) ----------------
[stepper_z]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -1.7  # This gives you room to calibrate
position_max: 200

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.550
# hold_current: 0.5
stealthchop_threshold: 0
# sense_resistor: 0.11

[stepper_z1]
step_pin: P1.15
dir_pin: !P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: P1.1
run_current: 0.550
# hold_current: 0.5
stealthchop_threshold: 0
# sense_resistor: 0.11

[z_tilt]
# Physical coordinates of the Z lead screws
# On a Bear/Prusa, these are typically outside the bed area
z_positions:
    -35, 105   # Left lead screw
    285, 105   # Right lead screw

# Points on the bed where the PROBE will land
# Formula used: Probe_Point - Offset must be >= position_min
points:
    30, 105    # Left: 30 - 23 offset = 7 (Safe, > 0)
    215, 105   # Right: 215 - 23 offset = 192 (Safe, < 250)
    
speed: 100     # Increased for efficiency
horizontal_move_z: 5
retries: 5     # Increased retries to ensure it hits that tight tolerance
retry_tolerance: 0.02

# ------------ Extruder --------------
[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 7.71  # MK3S default - adjust based on your gear ratio
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: P2.7
sensor_type: ATC Semitec 104GT-2
sensor_pin: P0.24
#control: pid
#pid_Kp: 21.45
#pid_Ki: 2.18
#pid_Kd: 52.82
min_temp: 0
max_temp: 300
# Essential for load/unload macros
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 120.0

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.650
# hold_current: 0.35
stealthchop_threshold: 0

# [tmc2209 extruder]
# uart_pin: P1.1
# run_current: 0.7
# hold_current: 0.4
# sense_resistor: 0.11
# stealthchop_threshold: 0

# ---------------- Heated Bed ----------------
[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
# --- Slow down the frequency to stop the noise ---
pwm_cycle_time: 0.10
# --------------------------------------------------
#control: pid
#pid_Kp: 25.37
#pid_Ki: 0.75
#pid_Kd: 573.31
min_temp: 0
max_temp: 120

# ---------------- Fans ----------------
[fan]
pin: P2.3

[heater_fan hotend_fan]
pin: P2.4
heater: extruder
heater_temp: 50

# --------------- Probe ----------------
[probe]
pin: ^P0.10
x_offset: 23
y_offset: 5  # Adjust based on your probe location
#z_offset: 0
speed: 5.0
samples: 3                   # Takes 3 samples
samples_result: median       # Uses the middle value (ignores outliers)
sample_retract_dist: 2.0     # How far to lift between samples
samples_tolerance: 0.02      # Increase this slightly (0.01 is very tight)
samples_tolerance_retries: 3 # Give it 3 chances to get it right before erroring

[temperature_sensor pinda]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.23
min_temp: 0
max_temp: 100

[safe_z_home]
home_xy_position: 125,105
speed: 50
z_hop: 10
z_hop_speed: 10

# ---------------- Bed Mesh ----------------

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 24, 6         # X: (0 + 23 offset + 1 buffer), Y: (0 + 5 offset + 1 buffer)
mesh_max: 225, 195      # Keep away from the extreme rear/right edges
probe_count: 3,3
algorithm: bicubic
fade_start: 1
fade_end: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"

# See the sample-lcd.cfg file for definitions of common LCD displays.
######################################################################
# Fysetc Mini 12864Panel v2.1 (with neopixel backlight leds)
######################################################################

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
## Some micro-controller boards may require an spi bus to be specified:
#spi_bus: spi
## Alternatively, some micro-controller boards may work with software spi:
#spi_software_miso_pin: EXP2_1
#spi_software_mosi_pin: EXP2_6
#spi_software_sclk_pin: EXP2_2

[output_pin beeper]
pin: EXP1_1

[neopixel fysetc_mini12864]
pin: EXP1_6
chain_count: 3
color_order: RGB
initial_RED: 0.4
initial_GREEN: 0.4
initial_BLUE: 0.4

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

    M140 S{BED_TEMP}             ; Start heating bed
    G90                          ; Absolute coordinates
    G28                          ; Home all axes
    
    Z_TILT_ADJUST                ; Level the dual Z motors
    G28 Z                        ; Re-home Z (Z-tilt can shift the center Z zero)
    
    BED_MESH_CALIBRATE ADAPTIVE=1 ; Probe only the print area (Requires Klipper v0.12+)

    G1 X0 Y-3 Z5 F5000           ; Move to wait position
    M190 S{BED_TEMP}             ; Wait for bed temp
    M109 S{EXTRUDER_TEMP}        ; Wait for nozzle temp
    
    # Prime line logic... (same as before)
    G1 Z0.28 F240
    G92 E0
    G1 X60 E9 F1000      ; intro line
    G1 X100 E12.5 F1000    ; continue line
    G92 E0

[gcode_macro END_PRINT]
gcode:
    # Turn off heaters
    M140 S0
    M104 S0
    M106 S0
    
    # Relative positioning
    G91
    # Retract the filament a bit and lift nozzle
    G1 E-2 F2700
    G1 Z10 F3000
    
    # Absolute positioning
    G90
    # Present the print (Move bed forward)
    # Adjust Y210 if your Bear frame allows more travel
    G1 X0 Y210 F3000
    
    # Disable steppers (Optional - keeps them cool)
    M84
    
    # Beep or feedback
    M117 Print Complete

[gcode_macro M600]
gcode:
    PAUSE
    # Moves the head away so you can swap filament
    G1 X10 Y10 Z50 F3000

